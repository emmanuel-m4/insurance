name: Pull Request C.I
# restore, lint, build, test, static code analysis (CodeQL)
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5.2.0
        id: vars
        with:
          dotnet-version: "10"

      - name: Lint
        run: dotnet format src --verify-no-changes

      - name: Build
        run: dotnet build src -c Release --no-restore -warnaserror

      - name: Test
        run: |
          dotnet test src -c Release --no-build --verbosity n 

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-results-${{steps.vars.outputs.dotnet-version}}
          path: TestResults-${{steps.vars.outputs.dotnet-version}}
          # Always post test results
        if: ${{ always() }}
  codeQL:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: CodeQL placehoder
        run: echo "This is a placeholder for static analysis"
