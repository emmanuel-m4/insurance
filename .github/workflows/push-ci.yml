name: Push C.I

on:
  workflow_dispatch:
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5.2.0
        id: vars
        with:
          dotnet-version: "10"

      - name: Lint
        run: dotnet format src --verify-no-changes
      
      - name: Restore
        run: dotnet restore src        

      - name: Build
        run: dotnet build src -c Release --no-restore

      - name: Test
        run: |
          dotnet test src -c Release --no-build --verbosity normal --collect "XPlat Code Coverage" --logger trx --results-directory=src/Test/Results-${{github.ref_name}}

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{github.ref_name}}
          path: src/Test/Results-${{github.ref_name}}
          # Always post test results
        if: ${{ always() }}

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build src -t ghcr.io/${{github.repository}}:${GITHUB_SHA::7}

      # - name: Scan Image
      #   run: |
      #     docker scout cves ghcr.io/${{github.repository}}:${GITHUB_SHA::7} --only-vuln-packages --format markdown > docker-scout.md

      # - name: Upload Scan results
      #   uses: actions/upload-artifact@v4
